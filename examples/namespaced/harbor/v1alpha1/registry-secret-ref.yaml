apiVersion: harbor.m.crossplane.io/v1alpha1
kind: Registry
metadata:
  name: chainguard
  namespace: crossplane-system
spec:
  forProvider:
    name: chainguard
    providerName: docker-registry
    endpointUrl: https://cgr.dev
    accessIdSecretRef:
      name: chainguard-pull-proxy
      key: username
    accessSecretSecretRef:
      name: chainguard-pull-proxy
      key: password
